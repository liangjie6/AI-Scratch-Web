# AI Scratch Web on the public kfcv50.icu HTTPS endpoint.
# The certificate is shared with the existing system nginx sites and remains
# root-owned. Publish frontend/dist with deploy/system/publish-frontend.sh.

upstream ai_scratch_web_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 9966 ssl default_server;
    listen [::]:9966 ssl default_server;
    server_name kfcv50.icu www.kfcv50.icu;

    ssl_certificate     /etc/nginx/ssl/kfcv50.icu.pem;
    ssl_certificate_key /etc/nginx/ssl/kfcv50.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AiScratchWebTLS:2m;
    ssl_session_timeout 1h;

    # nginx uses error 497 for a plain HTTP request sent to an SSL listener.
    # Redirect to the certificate's domain, including for clients using a LAN IP.
    error_page 497 =301 https://kfcv50.icu:9966$request_uri;

    root /var/www/ai-scratch-web;
    include /etc/nginx/snippets/shared-404.conf;
    index index.html;
    client_max_body_size 8m;

    location /chunks/ {
        rewrite ^/chunks/(.*)$ /assets/scratch/chunks/$1 last;
    }

    location /static/assets/ {
        rewrite ^/static/assets/(.*)$ /assets/scratch/static/assets/$1 last;
    }

    location /api/ {
        proxy_pass http://ai_scratch_web_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass http://ai_scratch_web_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
