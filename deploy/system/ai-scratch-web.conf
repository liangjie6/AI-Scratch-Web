# AI Scratch Web — system nginx site (requires root to install).
#
#   sudo cp deploy/system/ai-scratch-web.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/ai-scratch-web.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace __REPO_ROOT__ with this repository's absolute path first (the
# installer script does that for you).

upstream ai_scratch_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen      9966 default_server;
    listen      [::]:9966 default_server;
    server_name _;

    root  __REPO_ROOT__/frontend/dist;
    index index.html;

    client_max_body_size 8m;

    location /chunks/ {
        rewrite ^/chunks/(.*)$ /assets/scratch/chunks/$1 last;
    }

    location /static/assets/ {
        rewrite ^/static/assets/(.*)$ /assets/scratch/static/assets/$1 last;
    }

    location /api/ {
        proxy_pass         http://ai_scratch_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;
    }

    location = /health {
        proxy_pass       http://ai_scratch_backend;
        proxy_buffering  off;
    }

    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
