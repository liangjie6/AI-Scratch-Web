      a:link,

      }
      #wrapper {

      }
      .loading #wrapper {
        visibility: hidden;
      }
      #monitors {
        position: absolute;
        top: 0;
        left: 0;
      }
      % stretch %
      #wrapper {
        width: 100vw;
        height: 100vh;
      }
      % /stretch %
      % fit %
      #wrapper {
        background: hsla(215, 100%, 95%, 1);
        width: 100vw;
        /* height: {HEIGHT/WIDTH%}vw; */
      }
      @media (min-aspect-ratio: {PROJECT_RATIO}) {
        #wrapper {
          height: calc(100vh - 50px);
          width: calc({WIDTH/HEIGHT%}vh - 50px);
          margin-bottom: 50px;
        }
      }
      % /fit %
      #stage {
        width: 100%;
        height: 100%;
      }
      % loading-progress %
      #loading-progress {
        color: #0ff;
        position: fixed;
        bottom: 0;
        left: 0;
        font-size: 16px;
      }
      % /loading-progress %
      % loading-image %
      #loading-image {
        position: fixed;
        max-width: 100%;
        max-height: 100%;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        margin: auto;
      }

      .monitor {
        position: absolute;
        border: 1px solid transparent;
        % monitor-box %
        border-color: rgba(0, 0, 0, 0.2);
        background-color: rgba(0, 0, 0, 0.3);
        % /monitor-box %
        border-radius: 0.25rem;
        font-size: 0.75rem;
        overflow: hidden;
        padding: 3px;
        color: {MONITOR_TEXT};
        color: inherit;
        white-space: pre;
        background-color: hsla(215, 100%, 95%, 1);
      }
      .monitor-label {
        margin: 0 5px;
        font-weight: bold;
      }
      .monitor-value {
        display: inline-block;
        vertical-align: top;
        min-width: 34px;
        text-align: center;
        border-radius: 0.25rem;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: text;
        transform: translateZ(0);
      }
      .default .monitor-value, .slider .monitor-value {
        % monitor-box % background-color: rgba(0, 0, 0, 0.5); % /monitor-box %
        background: rgb(255, 140, 26);
        color: white;
        margin: 0 5px;
        padding: 1px 3px;
      }
      .large {
        % monitor-box % background-color: rgba(0, 0, 0, 0.6); % /monitor-box %
        background: rgb(255, 140, 26);
        color: white;
        padding: 0.1rem 0.25rem;
        min-width: 3rem;
      }
      .large .monitor-label {
        display: none;
      }
      .large .monitor-value {
        font-size: 1rem;
        width: 100%;
      }
      .list {
        padding: 0;
        overflow: auto;
        overflow-x: hidden;
      }
      .list .monitor-label {
        text-align: center;
        padding: 3px;
        width: 100%;
        display: block;
        margin: 0;
        box-sizing: border-box;
        white-space: pre-wrap;
        background: white;
      }
      .list .monitor-value {
        display: block;
      }
      .row {
        margin: 2px 5px;
        transform: translateZ(0);
        text-align: left;
        border-radius: 0.25rem;
        border: 1px solid transparent;
        % monitor-box %
        border-color: rgba(0, 0, 0, 0.2);
        /* background-color: rgba(0, 0, 0, 0.5); */
        % /monitor-box %
        height: 20px;
        line-height: 20px;
        padding: 0 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        background: rgb(252, 102, 44);
        color: white;
      }
      % monitor-colour %
      .default .monitor-value, .slider .monitor-value, .large, .row {
        background-color: {COLOUR};
      }
      % /monitor-colour %
      .slider input {
        display: block;
        width: 100%;
        transform: translateZ(0);
      }
      #asking-box {
        display: none;
        position: absolute;
        left: 0.5rem;
        bottom: 10px;
        right: 0.5rem;
        background-color: white;
        border: 1px solid hsla(0, 0%, 0%, 0.15);
        border-radius: 0.5rem;
        padding: 1rem;
      }
      .asking #asking-box {
        display: block;
      }
      #question {
        display: block;
        margin: 0;
        font-size: 14px;
        font-weight: bold;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: hsla(225, 15%, 40%, 1);
        padding-bottom: 0.5rem;
      }
      .answer-wrapper {
        position: relative;
      }
      .answer-wrapper:after{
      }
      #answer {
        border: none;
        background: none;
        width: 100%;
        font: inherit;
        font-size: 16px;
        box-sizing: border-box;
        height: 2rem;
        border-radius: 2rem;;
        padding: 0 2rem 0 .75rem;
        border: 1px solid hsla(0, 0%, 0%, 0.15);
        transition: all 0.2s ease-in;
        box-shadow: none;
      }
      #answer:focus {
        outline: none;
        border-color:  hsla(215, 100%, 65%, 1);
        box-shadow: 0 0 0 4px  hsla(215, 100%, 65%, 0.6);

      const requestStack = [];

      class VideoProvider {
          constructor () {
              this.mirror = true;

              this._frameCacheTimeout = 16;

              this._video = null;

              this._track = null;

              this._workspace = [];
          }

          static get FORMAT_IMAGE_DATA () {
              return 'image-data';
          }

          static get FORMAT_CANVAS () {
              return 'canvas';
          }

          static get DIMENSIONS () {
              return [WIDTH, HEIGHT];

          }

              return this._video;
          }

          enableVideo () {
              this.enabled = true;
              return this._setupVideo();
          }

          disableVideo () {
              this.enabled = false;
              if (this._singleSetup) {
                  this._singleSetup
                      .then(this._teardown.bind(this))
                      .catch(err => this.onError(err));
              }
          }

          _teardown () {
              if (this.enabled === false) {

                  this._singleSetup = null;
                  this._video = null;
                  if (this._track && disableTrack) {
                      this._track.stop();
                  }
                  this._track = null;
              }
          }

          getFrame ({
              dimensions = VideoProvider.DIMENSIONS,
              mirror = this.mirror,
              format = VideoProvider.FORMAT_IMAGE_DATA,
              cacheTimeout = this._frameCacheTimeout
          }) {
              if (!this.videoReady) {
                  return null;
              }
              const [width, height] = dimensions;
              const workspace = this._getWorkspace({dimensions, mirror: Boolean(mirror)});
              const {videoWidth, videoHeight} = this._video;
              const {canvas, context, lastUpdate, cacheData} = workspace;
              const now = Date.now();

                      context.scale(-1, 1);
                      context.translate(width * -1, 0);

                  context.drawImage(this._video,
                      0, 0, videoWidth, videoHeight,
                      0, 0, width, height

        const renderer = new window.ScratchRender(canvas % custom-ratio % , -WIDTH / 2, WIDTH / 2, -HEIGHT / 2, HEIGHT / 2 % /custom-ratio %);
        resize();
        Scratch.renderer = renderer;
        vm.attachRenderer(renderer);

        const audioEngine = new window.AudioEngine();
        Scratch.audioEngine = audioEngine;
        vm.attachAudioEngine(audioEngine);

        const svgRenderer = new ScratchSVGRenderer.SVGRenderer();
        Scratch.svgRenderer = svgRenderer;
        vm.attachV2SVGAdapter(svgRenderer);

        const bitmapAdapter = new ScratchSVGRenderer.BitmapAdapter(null, null, % custom-ratio % WIDTH, HEIGHT % /custom-ratio %);
        Scratch.bitmapAdapter = bitmapAdapter;
        vm.attachV2BitmapAdapter(bitmapAdapter);

        const videoProvider = new VideoProvider();
        Scratch.videoProvider = videoProvider;
        vm.setVideoProvider(videoProvider);

        const noop = () => null;
        let ws;
        function openConnection() {
          try {
            ws = new WebSocket({CLOUD_HOST});
          } catch (err) {
            console.warn(err);
            return;
          }
          ws.onmessage = onMessage;
          ws.onopen = onOpen;
          ws.onclose = onClose;
        }
        function onMessage(e) {
          e.data.split('\n').forEach(message => {
            if (message) {
              const { name, value } = JSON.parse(message)
              vm.postIOData('cloud', {
                varUpdate: {name, value}
              });
            }
          });
        }
        function sendData(data) {
          data.user = DESIRED_USERNAME;
          data.project_id = PROJECT_ID;
          ws.send(JSON.stringify(data) + '\n');
        }
        function onOpen() {
          sendData({method: 'handshake'});
        }
        function onClose() {
          setTimeout(openConnection, 500);
        }
        const cloudProvider = {
          updateVariable(name, value) {
            % special-cloud %
            if (name === CLOUD_PREFIX + 'eval') {
              try {
                vm.postIOData('cloud', {
                  varUpdate: {
                    name: CLOUD_PREFIX + 'eval output',
                    value: eval(value)
                  }
                });
              } catch (err) {
                vm.postIOData('cloud', {
                  varUpdate: {
                    name: CLOUD_PREFIX + 'eval error',
                    value: err.toString()
                  }
                });
              }
            } else % cloud-ws % if (name.startsWith(CLOUD_PREFIX + 'local storage')) % /cloud-ws % {
              % /special-cloud %
              % cloud-localstorage %
              try {
                localStorage.setItem('[s3] ' + name, value);
              } catch (e) {
                console.error('Cannot use localStorage?', e);
              }
              % /cloud-localstorage %
              % special-cloud %
              % cloud-ws %
            } else {
              % /cloud-ws %
              % /special-cloud %
              % cloud-ws %
              sendData({method: 'set', name, value});
              % /cloud-ws %
              % special-cloud %
            }
            % /special-cloud %
          },
          createVariable: noop,
          renameVariable: noop,
          deleteVariable: noop,
          % cloud-ws %
          requestCloseConnection() {
            if (ws && ws.readyState !== WebSocket.CLOSING && ws.readyState !== WebSocket.CLOSED) {
              ws.onclose = noop;
              ws.close();
            }
          }
          % /cloud-ws %
          % cloud-localstorage-provider %
          requestCloseConnection: noop
          % /cloud-localstorage-provider %
        };

        vm.setCompatibilityMode(COMPAT);
        vm.setTurboMode(TURBO);
        % limits %
        vm.requireLimits(false);
        % /limits %

        vm.start();

        % loading-progress %
        const progress = document.getElementById('loading-progress');
        const _load = storage.webHelper.load;
        let total = 0, complete = 0;
        storage.webHelper.load = function (...args) {
          const result = _load.call(this, ...args);
          total += 1;
          progress.textContent = complete + '/' + total;
          result.then(() => {
            complete += 1;
            progress.textContent = complete + '/' + total;
          });
          return result;
        };
        % /loading-progress %
        % loading-image %
        const loadingImage = document.getElementById('loading-image');
        % /loading-image %

        // MOUSE
        /* https://github.com/LLK/scratch-gui/blob/develop/src/containers/stage.jsx#L176-L300 */
        const getEventXY = e => {
          if (e.touches && e.touches[0]) {
            return {x: e.touches[0].clientX, y: e.touches[0].clientY};
          } else if (e.changedTouches && e.changedTouches[0]) {
            return {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY};
          }
          return {x: e.clientX, y: e.clientY};
        };
        let mouseDown = false,
        mouseDownPosition = null,
        mouseDownTimeoutId = null,
        isDragging = false,
        dragId = null,
        dragOffset = null;
        function cancelMouseDownTimeout() {
          if (mouseDownTimeoutId !== null) {
            clearTimeout(mouseDownTimeoutId);
          }
          mouseDownTimeoutId = null;
        }
        // https://github.com/LLK/scratch-gui/blob/develop/src/containers/stage.jsx#L337-L366
        function onStartDrag() {
          if (dragId) return;
          const drawableId = renderer.pick(...mouseDownPosition);
          if (drawableId === null) return;
          const targetId = vm.getTargetIdForDrawableId(drawableId);
          if (targetId === null) return;
          const target = vm.runtime.getTargetById(targetId);
          if (!target.draggable) return;
          target.goToFront();
          const drawableData = renderer.extractDrawable(drawableId, ...mouseDownPosition);
          vm.startDrag(targetId);
          isDragging = true;
          dragId = targetId;
          dragOffset = drawableData.scratchOffset;
        }
        function getScratchCoords(x, y, rect) {
          const nativeSize = renderer.getNativeSize();
          return [
            (nativeSize[0] / rect.width) * (x - (rect.width / 2)),
            (nativeSize[1] / rect.height) * (y - (rect.height / 2))
          ];
        }
        % pointer-lock %
        function pointerLocked() {
          return document.pointerLockElement === canvas ||
            document.mozPointerLockElement === canvas;
        }
        % /pointer-lock %
        function mousemove(e) {
          % pointer-lock %
          if (pointerLocked()) {
            vm.postIOData('mouse', {
              x: e.movementX + WIDTH / 2,
              y: e.movementY + HEIGHT / 2,
              canvasWidth: WIDTH,
              canvasHeight: HEIGHT
            });
            return;
          }
          % /pointer-lock %
          const {x, y} = getEventXY(e);
          const rect = canvas.getBoundingClientRect();
          const mousePosition = [x - rect.left, y - rect.top];
          if (mouseDown && !isDragging) {
            const distanceFromMouseDown = Math.sqrt(
              Math.pow(mousePosition[0] - mouseDownPosition[0], 2) +
              Math.pow(mousePosition[1] - mouseDownPosition[1], 2)
            );
            if (distanceFromMouseDown > 3) {
              cancelMouseDownTimeout();
              onStartDrag();
            }
          }
          if (mouseDown && isDragging) {
            const spritePosition = getScratchCoords(mousePosition[0], mousePosition[1], rect);
            vm.postSpriteInfo({
              x: spritePosition[0] + dragOffset[0],
              y: -(spritePosition[1] + dragOffset[1]),
              force: true
            });
          }
          vm.postIOData('mouse', {
            x: mousePosition[0],
            y: mousePosition[1],
            canvasWidth: rect.width,
            canvasHeight: rect.height
          });
        }
        function mousedown(e) {
          mouseDown = true;
          % pointer-lock %
          if (pointerLocked()) {
            vm.postIOData('mouse', {
              isDown: true,
              x: e.movementX + WIDTH / 2,
              y: e.movementY + HEIGHT / 2,
              canvasWidth: WIDTH,
              canvasHeight: HEIGHT
            });
            return;
          }
          % /pointer-lock %
          const {x, y} = getEventXY(e);
          const rect = canvas.getBoundingClientRect();
          const mousePosition = [x - rect.left, y - rect.top];
          mouseDownPosition = mousePosition;
          mouseDownTimeoutId = setTimeout(onStartDrag, 400);
          vm.postIOData('mouse', {
            isDown: true,
            x: mousePosition[0],
            y: mousePosition[1],
            canvasWidth: rect.width,
            canvasHeight: rect.height
          });
          e.preventDefault();
          if (!document.body.classList.contains('asking')) {
            window.focus();
          }
        }
        function mouseup(e) {
          cancelMouseDownTimeout();
          mouseDown = false;
          mouseDownPosition = null;
          if (isDragging) {
            vm.stopDrag(dragId);
            isDragging = false;
            dragOffset = null;
            dragId = null;
          }
          % pointer-lock %
          if (pointerLocked()) {
            vm.postIOData('mouse', {
              isDown: false,
              x: e.movementX + WIDTH / 2,
              y: e.movementY + HEIGHT / 2,
              canvasWidth: WIDTH,
              canvasHeight: HEIGHT
            });
            return;
          }
          % /pointer-lock %
          const {x, y} = getEventXY(e);
          const rect = canvas.getBoundingClientRect();
          vm.postIOData('mouse', {
            isDown: false,
            x: x - rect.left,
            y: y - rect.top,
            canvasWidth: rect.width,
            canvasHeight: rect.height
          });
        }
        document.addEventListener('mousemove', mousemove);
        canvas.addEventListener('mousedown', mousedown);
        document.addEventListener('mouseup', mouseup);
        document.addEventListener('touchmove', mousemove);
        canvas.addEventListener('touchstart', mousedown, {passive: false});
        document.addEventListener('touchend', mouseup, {passive: false});
        canvas.addEventListener('wheel', e => {
          vm.postIOData('mouseWheel', {
            deltaX: e.deltaX,
            deltaY: e.deltaY
          });
          e.preventDefault();
        });
        window.addEventListener('resize', resize);
        % pointer-lock %
        canvas.requestPointerLock = canvas.requestPointerLock ||
          canvas.mozRequestPointerLock;
        canvas.addEventListener('click', e => {
          canvas.requestPointerLock();
        });
        % /pointer-lock %

        // KEY PRESSED?
        /* https://github.com/LLK/scratch-gui/blob/develop/src/lib/vm-listener-hoc.jsx#L86-L115 */
        document.addEventListener('keydown', e => {
          if (e.target !== document && e.target !== document.body) return;
          const key = !e.key || e.key === 'Dead' ? e.keyCode : e.key;
          vm.postIOData('keyboard', {
            key: key,
            isDown: true
          });
          if (e.keyCode === 32 || e.keyCode >= 37 && e.keyCode <= 40) {
            e.preventDefault();
          }
        });
        document.addEventListener('keyup', e => {
          const key = !e.key || e.key === 'Dead' ? e.keyCode : e.key;
          vm.postIOData('keyboard', {
            key: key,
            isDown: false
          });
          if (e.target !== document && e.target !== document.body) {
            e.preventDefault();
          }
        });

        // ASK AND WAIT
        const question = document.getElementById('question');
        const askBox = document.getElementById('answer');
        const askBtn = document.getElementById('answer-btn');
        vm.runtime.addListener('QUESTION', questionData => {
          /* null means the asking was interrupted by stop script block */
          if (questionData === null) {
            document.body.classList.remove('asking');
          } else {
            document.body.classList.add('asking');
            question.textContent = questionData;
            askBox.value = '';
            askBox.focus();
          }
        });

        askBox.addEventListener('keydown', e => {
          if (e.keyCode === 13) {
            document.body.classList.remove('asking');
            /* submit answer after because it starts the next question synchronously */
            vm.runtime.emit('ANSWER', askBox.value);
          }
        });

        askBtn.addEventListener('click', e => {
          document.body.classList.remove('asking');
          vm.runtime.emit('ANSWER', askBox.value);
        });

        // MONITORS
        const getVariable = (targetId, variableId) => {
            const target = targetId ?
                vm.runtime.getTargetById(targetId) :
                vm.runtime.getTargetForStage();
            return target.variables[variableId];
        };
        const monitorStates = {};
        let once = false;
        vm.runtime.addListener('MONITORS_UPDATE', monitors => {
          monitors.forEach((record, id) => {
            if (!monitorStates[id]) {
              const monitor = document.createElement('div');
              monitor.className = 'monitor ' + record.mode;
              monitor.style.left = record.x + 'px';
              monitor.style.top = record.y + 'px';
              if (record.mode === 'list') {
                // If the list has never been resized, the width/height will be 0. Weird
                monitor.style.width = (record.width || 100) + 'px';
                monitor.style.height = (record.height || 200) + 'px';
              }
              const label = document.createElement('span');
              label.className = 'monitor-label';
              let name = record.params.VARIABLE || record.params.LIST || record.opcode;
              if (record.spriteName) name = `${record.spriteName}: ${name}`;
              label.textContent = name;
              monitor.appendChild(label);
              const value = document.createElement('span');
              value.className = 'monitor-value';
              monitor.appendChild(value);
              monitorStates[id] = {monitor, value};
              if (record.mode === 'slider') {
                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = record.sliderMin;
                slider.max = record.sliderMax;
                slider.step = record.isDiscrete ? 1 : 0.01;
                slider.addEventListener('input', e => {
                  getVariable(record.targetId, id).value = slider.value;
                });
                slider.addEventListener('change', e => {
                  getVariable(record.targetId, id).value = slider.value;
                });
                monitorStates[id].slider = slider;
                monitor.appendChild(slider);
              }
              monitorWrapper.appendChild(monitor);
            }
            monitorStates[id].monitor.style.display = record.visible ? null : 'none';
            if (record.visible) {
              let value = record.value;
              if (typeof value === 'number') {
                value = Number(value.toFixed(6));
              }
              if (typeof value === 'boolean') {
                value = value.toString();
              }
              if (Array.isArray(value)) {
                if (monitorStates[id].lastValue === JSON.stringify(value)) return;
                monitorStates[id].value.innerHTML = '';
                value.forEach(val => {
                  const row = document.createElement('div');
                  row.className = 'row';
                  row.textContent = val;
                  monitorStates[id].value.appendChild(row);
                });
              } else {
                monitorStates[id].value.textContent = value;
                if (monitorStates[id].slider) monitorStates[id].slider.value = value;
              }
            }
          });
        });

        vm.postIOData('userData', {username: DESIRED_USERNAME});

        return Promise.resolve()

          % extension-url %
          .then(() => vm.extensionManager.loadExtensionURL(EXTENSION_URL))
          % /extension-url %

          .then(
            () => TYPE === 'file'
              ? fetch(FILE).then(r => r.arrayBuffer())
              : storage.load(storage.AssetType.Project).then(asset => asset.data)
          )
          .then(data => vm.loadProject(data))

          .then(() => {

        vm.setCloudProvider(cloudProvider);
        % cloud-localstorage %
        const stageVariables = vm.runtime.getTargetForStage().variables;
        for (const { name, isCloud } of Object.values(stageVariables)) {
          if (isCloud) {
            % special-cloud %
            % cloud-ws %
            if (!name.startsWith(CLOUD_PREFIX + 'local storage')) continue;
            % /cloud-ws %
            % /special-cloud %
            const value = localStorage.getItem('[s3] ' + name);
            if (value === null) continue;
            vm.postIOData('cloud', { varUpdate: { name, value } });
          }
        }
        window.addEventListener('storage', e => {
          if (e.storageArea === localStorage && e.key.slice(0, 5) === '[s3] ') {
            const name = e.key.slice(5);
            % special-cloud %
            % cloud-ws %
            if (!name.startsWith(`[s3] ${CLOUD_PREFIX}local storage`)) return;
            % /cloud-ws %
            % /special-cloud %
            vm.postIOData('cloud', {
              varUpdate: {
                name,
                value: e.newValue
              }
            });
          }
        });
        % /cloud-localstorage %
        % cloud-ws %
        openConnection();
        % /cloud-ws %

        % loading-progress %
        if (progress.parentNode) {
        progress.parentNode.removeChild(progress);
        }
        % /loading-progress %
        % loading-image %
        if (loadingImage.parentNode) {
        loadingImage.parentNode.removeChild(loadingImage);
        }
        document.body.classList.remove('loading');
        % /loading-image %

        if (window.RUN_DEFAULT) {
          vm.greenFlag();
        }

          });
      };

      window.onload = function () {
        runBenchmark();
        window.focus();
      };

      % fullscreen %
      function isFullscreen() {
        return document.fullscreenElement || document.mozFullScreenElement
          || document.webkitFullscreenElement || document.msFullscreenElement;
      }
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      fullscreenBtn.addEventListener('click', e => {
        fullscreenBtn.blur();
        if (isFullscreen()) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
          else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          if (document.body.requestFullscreen) document.body.requestFullscreen();
          else if (document.body.msRequestFullscreen) document.body.msRequestFullscreen();
          else if (document.body.mozRequestFullScreen) document.body.mozRequestFullScreen();
          else if (document.body.webkitRequestFullscreen) document.body.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
        }
      });
      function onFullscreenChange() {
        if (isFullscreen()) {
          document.body.classList.add('fullscreen');
        } else {
          document.body.classList.remove('fullscreen');
        }
      }
      document.addEventListener('fullscreenchange', onFullscreenChange);
      document.addEventListener('mozfullscreenchange', onFullscreenChange);
      document.addEventListener('webkitfullscreenchange', onFullscreenChange);
      document.addEventListener('msfullscreenchange', onFullscreenChange);
      % /fullscreen %

      const greenFlagBtn = document.querySelector('#green-flag');
      greenFlagBtn.addEventListener('click', function() {
        greenFlagBtn.blur();
        Scratch.vm.greenFlag();
      }, false);

      document.querySelector('#stop-btn').addEventListener('click', function() {
        Scratch.vm.stopAll();
      }, false);

      const descModal = document.querySelector('#desc-overlay');
      const desc = document.querySelector('#desc');
      const descBtn = document.querySelector('#desc-btn');
      const descCloseBtn = document.querySelector('#desc .close-btn');

      function toggleDescModal() {
        const open = descModal.classList.contains('open');
        if (open) {
          descModal.classList.remove('open');
        } else if (window.DESCRIPTION) {
          descModal.classList.add('open');
        }
      }
      descBtn.addEventListener('click', function() {
        descBtn.blur();
        toggleDescModal()
      }, false);

      descModal.addEventListener('click', function() {
        toggleDescModal()
      }, false);

      desc.addEventListener('click', function(evt) {
        desc.blur();
        evt.stopPropagation();
      }, false);

      descCloseBtn.addEventListener('click', function(evt) {
        descCloseBtn.blur();
        descModal.classList.remove('open');
      }, false);

      if (window.DESCRIPTION && window.OPEN_DESC_DEFAULT) {
        toggleDescModal()
      }

    </script>
  </body>
</html>
